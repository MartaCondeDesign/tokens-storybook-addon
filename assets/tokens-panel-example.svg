  <rect x="748" y="164" width="394" height="42" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="768" y="191" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Color</text>
  <text x="854" y="191" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Typography</text>
