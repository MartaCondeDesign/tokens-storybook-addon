<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Tokens panel highlighting a button background</title>
  <desc id="desc">A Storybook-like window with a button highlighted in blue on the left and a Tokens panel showing the Background color row on the right.</desc>
  <rect width="1200" height="680" fill="#f4f6f8"/>
  <rect x="34" y="28" width="1132" height="624" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="34" y="28" width="1132" height="52" rx="12" fill="#17202b"/>
  <circle cx="66" cy="54" r="7" fill="#f87171"/><circle cx="90" cy="54" r="7" fill="#fbbf24"/><circle cx="114" cy="54" r="7" fill="#4ade80"/>
  <text x="150" y="60" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18" font-weight="700">Storybook</text>
  <rect x="34" y="80" width="690" height="572" fill="#f8fafc"/>
  <text x="70" y="126" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Preview / Button / Primary</text>
  <rect x="226" y="260" width="306" height="112" rx="10" fill="#ffffff" stroke="#dbe3ec"/>
