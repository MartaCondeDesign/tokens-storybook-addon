  <text x="936" y="264" fill="#64748b" font-family="Arial, sans-serif" font-size="13" font-weight="700">TOKEN</text>
  <rect x="748" y="282" width="394" height="76" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="768" y="313" fill="#0f172a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Background</text>
  <text x="936" y="313" fill="#334155" font-family="Arial, sans-serif" font-size="14">--color-action-primary</text>
  <rect x="1080" y="329" width="38" height="16" rx="3" fill="#2563eb"/>
  <text x="768" y="339" fill="#64748b" font-family="Arial, sans-serif" font-size="12">button / primary</text>
